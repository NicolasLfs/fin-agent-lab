[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-agent"
version = "0.1.0"
description = "Motor de agentes financeiros do fin-agent-lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.36,<2",
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<2",
    "langgraph>=0.2.60,<1",
    "langgraph-checkpoint-postgres>=2,<4",
    "openai>=1.60,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "qdrant-client>=1.13,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10"]

[project.scripts]
fin-agent = "fin_agent.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
