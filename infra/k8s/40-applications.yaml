apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: fin-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: agent
          image: fin-agent-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: fin-agent-secrets
            - configMapRef:
                name: fin-agent-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fin-agent-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://fin_agent:$(POSTGRES_PASSWORD)@postgres:5432/fin_agent?sslmode=disable
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: fin-agent
spec:
  selector:
    app: agent
  ports:
    - name: http
      port: 8080
      targetPort: http
---
