apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-worker
  namespace: fin-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-worker
  template:
    metadata:
      labels:
        app: market-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: market-worker
          image: fin-agent-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/market-worker"]
          envFrom:
            - secretRef:
                name: fin-agent-secrets
            - configMapRef:
                name: fin-agent-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fin-agent-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://fin_agent:$(POSTGRES_PASSWORD)@postgres:5432/fin_agent?sslmode=disable
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
